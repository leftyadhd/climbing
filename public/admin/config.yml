backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

locale: 'ko'

collections:
  # 등반로그 - 세션 단위 기록
  - name: "logs"
    label: "등반로그"
    folder: "src/content/logs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "날짜", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: "로그 유형"
        name: "type"
        widget: "select"
        options: ["log", "misc"]
        default: "log"
        required: false
      - { label: "암장", name: "crag", widget: "string", required: false, hint: "crags slug (예: 북한산-인수봉)" }
      - { label: "구역/섹터", name: "sector", widget: "string", required: false, hint: "예: 무당골, 관운봉 슬랩" }
      - { label: "동행 (그룹)", name: "crew", widget: "list", required: false, hint: "예: 연우지암" }
      - { label: "파트너 (로프)", name: "partners", widget: "list", required: false }
      - { label: "날씨", name: "weather", widget: "string", required: false }
      - label: "태그"
        name: "tags"
        widget: "list"
        required: false
      - label: "사진"
        name: "photos"
        widget: "list"
        required: false
        field: { label: "사진", name: "photo", widget: "image" }
      - label: "시도한 루트"
        name: "routes"
        widget: "list"
        required: false
        summary: "{{fields.name}} {{fields.grade}} — {{fields.status}}"
        fields:
          - label: "상태 ★"
            name: "status"
            widget: "select"
            options:
              - { label: "OS (온사이트)", value: "onsight" }
              - { label: "FL (플래시)", value: "flash" }
              - { label: "RP (레드포인트)", value: "redpoint" }
              - { label: "Send (완등)", value: "send" }
              - { label: "프로젝트 중", value: "projecting" }
              - { label: "시도", value: "attempt" }
              - { label: "실패", value: "failed" }
          - { label: "루트명 ★", name: "name", widget: "string", required: false, hint: "이름 모르면 route_ref만 입력" }
          - { label: "등급 ★", name: "grade", widget: "string", required: false, hint: "예: 5.11a, 5.10c" }
          - label: "스타일"
            name: "style"
            widget: "select"
            required: false
            options:
              - { label: "스포트/리드", value: "sport" }
              - { label: "트래드", value: "trad" }
              - { label: "볼더링", value: "boulder" }
              - { label: "탑로프", value: "top-rope" }
              - { label: "멀티피치", value: "multi-pitch" }
              - { label: "지구력", value: "endurance" }
          - { label: "crag 루트 연결 (route_ref)", name: "route_ref", widget: "string", required: false, hint: "crag 파일의 route id (예: 가위바위보). 입력 시 암장 루트와 자동 연결" }
          - label: "체감 난이도"
            name: "grade_feel"
            widget: "select"
            required: false
            options:
              - { label: "Soft (쉬운 편)", value: "soft" }
              - { label: "On (딱 맞음)", value: "on" }
              - { label: "Hard (어려운 편)", value: "hard" }
          - { label: "시도 횟수", name: "attempts", widget: "number", required: false }
          - { label: "메모", name: "notes", widget: "text", required: false }
          - { label: "사용한 기술", name: "techniques_used", widget: "list", required: false, hint: "위키 technique slug" }
      - { label: "본문", name: "body", widget: "markdown" }

  # 암장 (독립 컬렉션)
  - name: "crags"
    label: "암장"
    folder: "src/content/crags"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "산 이름 (그루핑용)", name: "mountain", widget: "string", required: false, hint: "예: 북한산, 도봉산" }
      - label: "위치"
        name: "location"
        widget: "object"
        required: false
        fields:
          - { label: "지역(시도)", name: "region", widget: "string" }
          - { label: "도시", name: "city", widget: "string", required: false }
          - { label: "위도", name: "lat", widget: "number", value_type: "float" }
          - { label: "경도", name: "lng", widget: "number", value_type: "float" }
      - { label: "암질", name: "rock_type", widget: "string", required: false }
      - label: "등반 종류"
        name: "disciplines"
        widget: "list"
        required: false
      - { label: "접근시간(분)", name: "approach_minutes", widget: "number", required: false }
      - label: "추천 계절"
        name: "season_best"
        widget: "list"
        required: false
      - label: "섹터 목록"
        name: "sectors"
        widget: "list"
        required: false
        fields:
          - { label: "ID (slug)", name: "id", widget: "string", hint: "영문/한글 slug. route의 sector 필드와 일치해야 함 (예: 숨은암장)" }
          - { label: "이름 (표시용)", name: "name", widget: "string", hint: "UI에 표시될 이름 (예: 숨은암장 (한우리암장))" }
          - { label: "설명", name: "description", widget: "string", required: false }
      - label: "태그"
        name: "tags"
        widget: "list"
        required: false
      - { label: "요약", name: "summary", widget: "text", required: false }
      - { label: "본문", name: "body", widget: "markdown" }

  # 위키 - 기술
  - name: "wiki-techniques"
    label: "위키 / 기술·무브"
    folder: "src/content/wiki/climbing-all/04-techniques"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "타입", name: "type", widget: "hidden", default: "technique" }
      - label: "난이도"
        name: "difficulty_level"
        widget: "select"
        options: ["beginner", "intermediate", "advanced"]
      - label: "관련 기술"
        name: "related_techniques"
        widget: "list"
        required: false
      - label: "주로 쓰이는 상황"
        name: "common_on"
        widget: "list"
        required: false
        hint: "overhang, slab, crack 등"
      - label: "태그"
        name: "tags"
        widget: "list"
        required: false
      - { label: "요약", name: "summary", widget: "text", required: false }
      - { label: "본문", name: "body", widget: "markdown" }

  # 위키 - 장비
  - name: "wiki-gear"
    label: "위키 / 장비"
    folder: "src/content/wiki/climbing-all/03-gear"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "타입", name: "type", widget: "hidden", default: "gear" }
      - { label: "장비 분류", name: "gear_category", widget: "string" }
      - { label: "브랜드", name: "brand", widget: "string", required: false }
      - { label: "가격(원)", name: "price_krw", widget: "number", required: false }
      - label: "용도"
        name: "use_cases"
        widget: "list"
        required: false
      - label: "태그"
        name: "tags"
        widget: "list"
        required: false
      - { label: "요약", name: "summary", widget: "text", required: false }
      - { label: "본문", name: "body", widget: "markdown" }

  # 위키 - 일반 가이드 (입문, 종류, 안전, 커뮤니티 등)
  - name: "wiki-guides"
    label: "위키 / 일반 가이드"
    files:
      - label: "입문 - 클라이밍이란?"
        name: "what-is-climbing"
        file: "src/content/wiki/climbing-all/01-getting-started/what-is-climbing.md"
        fields:
          - { label: "제목", name: "title", widget: "string" }
          - { label: "타입", name: "type", widget: "hidden", default: "guide" }
          - { label: "태그", name: "tags", widget: "list", required: false }
          - { label: "본문", name: "body", widget: "markdown" }
      - label: "입문 - 초보자 가이드"
        name: "beginner-guide"
        file: "src/content/wiki/climbing-all/01-getting-started/beginner-guide.md"
        fields:
          - { label: "제목", name: "title", widget: "string" }
          - { label: "타입", name: "type", widget: "hidden", default: "guide" }
          - { label: "태그", name: "tags", widget: "list", required: false }
          - { label: "본문", name: "body", widget: "markdown" }

  # 장비 인벤토리
  - name: "devices"
    label: "장비 인벤토리"
    folder: "src/content/devices"
    create: true
    slug: "{{category}}-{{brand}}-{{slug}}"
    fields:
      - { label: "이름", name: "title", widget: "string" }
      - { label: "카테고리", name: "category", widget: "string", hint: "예: 암벽화, 하네스, 카라비너" }
      - { label: "브랜드", name: "brand", widget: "string", required: false }
      - { label: "모델명", name: "model", widget: "string", required: false }
      - { label: "구매일", name: "purchased", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "구매가(원)", name: "price_krw", widget: "number", required: false }
      - label: "상태"
        name: "condition"
        widget: "select"
        options: ["new", "good", "fair", "retired"]
        default: "good"
      - { label: "현역 여부", name: "active", widget: "boolean", default: true }
      - { label: "위키 참조", name: "wiki_ref", widget: "string", required: false, hint: "wiki slug (예: climbing-all/03-gear/grigri)" }
      - label: "태그"
        name: "tags"
        widget: "list"
        required: false
      - { label: "메모", name: "body", widget: "markdown", required: false }
